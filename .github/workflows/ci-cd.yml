# ============================================================================
# FILE: .github/workflows/ci-cd.yml
# DESKRIPSI: Pipeline CI (Lint, Typecheck & Build Test di GitHub Actions)
#            Catatan: Proses CD (Deploy) ditangani oleh Cloudflare Worker Builds
# ============================================================================

name: ZXRSA Store CI Quality Check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: 🔍 Lint, Typecheck & Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js v24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'

      - name: 📦 Clean Install Dependencies
        run: npm ci

      - name: 🧹 Run ESLint Code Check
        run: npm run lint

      - name: 🛡️ Run TypeScript Typecheck
        run: |
          npx nuxt prepare
          npm run typecheck

      - name: 🏗️ Verify Production Build
        run: npm run build